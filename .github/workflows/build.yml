name: Build and Release AnhStudio Client

on:
  push:
    tags:
      - 'v*' # Chỉ kích hoạt robot khi có phiên bản mới bắt đầu bằng chữ v (VD: v1.0.1)

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11' # Bạn có thể đổi phiên bản Python cho khớp với máy bạn

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Cài các thư viện cần thiết cho app khách của bạn
        pip install PyQt6 requests pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        # Đóng gói thành 1 file .exe duy nhất, không hiện cửa sổ cmd (windowed)
        pyinstaller --noconfirm --onefile --windowed --name "AnhStudio" "honggou_tab.py"

    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/AnhStudio.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify AnhStudio Server
      env:
        ADMIN_PASS: ${{ secrets.ADMIN_PASSWORD }}
        VERSION: ${{ github.ref_name }}
      run: |
        # API của VPS Server của bạn
        $Url = "http://163.61.182.119:8000/api/admin/publish_update"
        
        # Link tải file .exe trực tiếp từ GitHub Release
        $DownloadUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AnhStudio.exe"
        
        $Body = @{
            latest_version = $env:VERSION.TrimStart('v')
            download_url = $DownloadUrl
            changelog = "Bản cập nhật tối ưu hệ thống: $env:VERSION"
            force_update = $true
        } | ConvertTo-Json
        
        Invoke-RestMethod -Uri $Url -Method Post -Body $Body -ContentType "application/json" -Headers @{ "Authorization" = "Bearer $env:ADMIN_PASS" }