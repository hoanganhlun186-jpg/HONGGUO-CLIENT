name: Build and Release AnhStudio Client
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 requests nuitka ordered-set zstandard pydub edge-tts srt playwright

    - name: Build EXE with Nuitka
      run: |
        python -m nuitka --onefile --windows-disable-console --enable-plugin=pyqt6 --include-package=capcut_tts_api --include-module=capcut_widget --include-module=translate_tab --include-data-files=Voice.json=Voice.json --output-filename=AnhStudio.exe --assume-yes-for-downloads honggou_tab.py

    # ── Tải ffmpeg + ffprobe (bản tĩnh, không cần cài) ──
    - name: Download ffmpeg
      shell: pwsh
      run: |
        $u = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
        Invoke-WebRequest -Uri $u -OutFile ffmpeg.zip
        Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
        $bin = Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
        Copy-Item $bin.FullName -Destination "ffmpeg.exe"
        $probe = Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
        Copy-Item $probe.FullName -Destination "ffprobe.exe"

    # ── Gom mọi thứ vào 1 folder HongguoDownloader rồi nén zip ──
    - name: Package into folder + zip
      shell: pwsh
      run: |
        $pkg = "HongguoDownloader"
        New-Item -ItemType Directory -Force -Path $pkg | Out-Null
        Copy-Item "AnhStudio.exe" -Destination $pkg
        Copy-Item "ffmpeg.exe"    -Destination $pkg
        Copy-Item "ffprobe.exe"   -Destination $pkg
        if (Test-Path "Voice.json")        { Copy-Item "Voice.json"        -Destination $pkg }
        if (Test-Path "capcut_tts_api")    { Copy-Item "capcut_tts_api" -Destination $pkg -Recurse }
        # File readme nhỏ cho khách
        "Chay AnhStudio.exe de su dung. Khong can cai dat gi them." | Out-File -FilePath "$pkg\HUONG_DAN.txt" -Encoding utf8
        Compress-Archive -Path "$pkg\*" -DestinationPath "HongguoDownloader.zip" -Force

    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          AnhStudio.exe
          HongguoDownloader.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify AnhStudio Server
      shell: pwsh
      env:
        ADMIN_PASS: ${{ secrets.ADMIN_PASSWORD }}
        VERSION: ${{ github.ref_name }}
      run: |
        $Url = "http://163.61.182.119:8000/api/admin/publish_update"
        $DownloadUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AnhStudio.exe"
        $Body = @{
            latest_version = $env:VERSION.TrimStart('v')
            download_url   = $DownloadUrl
            changelog      = "Ban cap nhat toi uu he thong: $env:VERSION"
            force_update   = $true
        } | ConvertTo-Json
        Invoke-RestMethod -Uri $Url -Method Post -Body $Body -ContentType "application/json" -Headers @{ "Authorization" = "Bearer $env:ADMIN_PASS" }
