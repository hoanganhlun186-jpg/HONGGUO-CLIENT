name: Build and Release AnhStudio Client

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 requests nuitka ordered-set zstandard

    - name: Build EXE with Nuitka
      run: |
        python -m nuitka --onefile --windows-disable-console --enable-plugin=pyqt6 --output-filename=AnhStudio.exe --assume-yes-for-downloads honggou_tab.py

    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        files: AnhStudio.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify AnhStudio Server
      env:
        ADMIN_PASS: ${{ secrets.ADMIN_PASSWORD }}
        VERSION: ${{ github.ref_name }}
      run: |
        $Url = "http://163.61.182.119:8000/api/admin/publish_update"
        $DownloadUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/AnhStudio.exe"
        $Body = @{
            latest_version = $env:VERSION.TrimStart('v')
            download_url = $DownloadUrl
            changelog = "Bản cập nhật tối ưu hệ thống: $env:VERSION"
            force_update = $true
        } | ConvertTo-Json
        Invoke-RestMethod -Uri $Url -Method Post -Body $Body -ContentType "application/json" -Headers @{ "Authorization" = "Bearer $env:ADMIN_PASS" }
