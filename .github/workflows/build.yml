name: Build and Release BOOM STUDIO
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 requests nuitka ordered-set zstandard pydub edge-tts srt pysrt playwright pycryptodome Pillow yt-dlp faster-whisper

    - name: Set MSVC heap size
      shell: pwsh
      run: echo "CL=/F536870912" >> $env:GITHUB_ENV

    - name: Build EXE with Nuitka
      # Dùng dấu ">" của YAML để gom tất cả các tham số bên dưới thành 1 dòng lệnh duy nhất, 
      # chống lỗi cú pháp xuống dòng của PowerShell
      run: >
        python -m nuitka --standalone --windows-disable-console 
        --enable-plugin=pyqt6 
        --include-package=capcut_tts_api 
        --include-package=Crypto 
        --include-package=playwright 
        --include-package=edge_tts 
        --include-package=pydub 
        --include-package=yt_dlp 
        --nofollow-import-to=yt_dlp.extractor.lazy_extractors
        --jobs=1
        --include-module=capcut_widget 
        --include-module=translate_tab 
        --include-module=render_tab 
        --include-module=render_dub_feature 
        --include-module=whisper_stt 
        --include-package=faster_whisper 
        --include-package=ctranslate2 
        --include-module=deepseek_translate 
        --include-module=shared_utils 
        --include-module=cenc_decrypt 
        --include-module=demucs_manager 
        --include-module=youtube_tab 
        --include-module=tiktok_tab 
        --include-module=douyin_tab 
        --include-module=bilibili_tab 
        --include-module=facebook_tab 
        --include-module=x_tab 
        --include-module=cookie_tab 
        --include-qt-plugins=multimedia 
        --include-data-files=Voice.json=Voice.json 
        --output-filename=BoomStudio.exe 
        --windows-icon-from-ico=icon.ico 
        --assume-yes-for-downloads honggou_tab.py

    - name: Download Demucs Wheels
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path wheels | Out-Null
        pip download torch torchaudio --extra-index-url https://download.pytorch.org/whl/cpu --python-version 3.11 --platform win_amd64 --only-binary=:all: -d wheels/
        pip download demucs julius einops omegaconf hydra-core --python-version 3.11 --platform win_amd64 --only-binary=:all: -d wheels/
        Compress-Archive -Path "wheels\*" -DestinationPath "demucs_wheels.zip" -Force

    # ffmpeg.exe / ffprobe.exe / yt-dlp.exe / aria2c.exe đã COMMIT SẴN trong repo
    # (checkout ở bước đầu đã có), nên KHÔNG cần bước tải nữa.

    - name: Package into folder + zip
      shell: pwsh
      run: |
        $pkg = "BoomStudio"
        # Nuitka --standalone xuất ra thư mục 'honggou_tab.dist' chứa
        # BoomStudio.exe + toàn bộ .dll/.pyd. Đổi tên thư mục đó thành gói.
        if (-not (Test-Path "honggou_tab.dist")) {
            Write-Error "KHONG THAY honggou_tab.dist - build Nuitka that bai"; exit 1
        }
        if (Test-Path $pkg) { Remove-Item $pkg -Recurse -Force }
        Rename-Item "honggou_tab.dist" $pkg

        # Kiểm tra exe chính tồn tại trong dist
        if (-not (Test-Path "$pkg\BoomStudio.exe")) {
            Write-Error "THIEU BoomStudio.exe trong goi"; exit 1
        }

        # Chép công cụ (đã commit trong repo) VÀO CẠNH exe trong gói
        $tools = @("ffmpeg.exe", "ffprobe.exe", "yt-dlp.exe")
        foreach ($t in $tools) {
            if (-not (Test-Path $t)) { Write-Error "THIEU FILE BAT BUOC: $t"; exit 1 }
            Copy-Item $t -Destination $pkg
        }
        if (Test-Path "aria2c.exe") { Copy-Item "aria2c.exe" -Destination $pkg }
        if (Test-Path "icon.ico")   { Copy-Item "icon.ico"   -Destination $pkg }
        if (Test-Path "Voice.json") { Copy-Item "Voice.json" -Destination $pkg }
        if (Test-Path "capcut_tts_api") { Copy-Item "capcut_tts_api" -Destination $pkg -Recurse }

        "Giai nen thu muc nay ra 1 cho co dinh (VD C:\BoomStudio) roi chay BoomStudio.exe." | Out-File -FilePath "$pkg\HUONG_DAN.txt" -Encoding utf8

        # Nén cả THƯ MỤC (bản portable, cho ai thích giải nén chạy tay)
        Compress-Archive -Path $pkg -DestinationPath "BoomStudio.zip" -Force

    - name: Build Installer (Inno Setup)
      shell: pwsh
      run: |
        # installer.iss đã commit sẵn trong repo. Truyền version qua /D,
        # tránh here-string PowerShell bị lỗi thụt lề trong YAML.
        $ver = "${{ github.ref_name }}".TrimStart('v')
        choco install innosetup --no-progress -y
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVer=$ver" "installer.iss"
        if (-not (Test-Path "BoomStudio_Setup.exe")) {
            Write-Error "Khong tao duoc BoomStudio_Setup.exe"; exit 1
        }

    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          BoomStudio_Setup.exe
          BoomStudio.zip
          demucs_wheels.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Notify BOOM STUDIO Server
      shell: pwsh
      env:
        ADMIN_PASS: ${{ secrets.ADMIN_PASSWORD }}
        VERSION: ${{ github.ref_name }}
      run: |
        $Url = "http://163.61.182.119:8000/api/admin/publish_update"
        # STANDALONE: app nằm trong cả thư mục -> update phải tải .ZIP (không
        # phải 1 file .exe như onefile trước đây).
        $DownloadUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/BoomStudio.zip"
        $Body = @{
            latest_version = $env:VERSION.TrimStart('v')
            download_url   = $DownloadUrl
            changelog      = "Ban cap nhat toi uu he thong: $env:VERSION"
            force_update   = $false
        } | ConvertTo-Json
        Invoke-RestMethod -Uri $Url -Method Post -Body $Body -ContentType "application/json" -Headers @{ "Authorization" = "Bearer $env:ADMIN_PASS" }